# Project-wide Gradle settings.
# Increase JVM heap for large Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure — required by all modern Android + Compose projects.
android.useAndroidX=true

# Disable R class transitive lookup to reduce build coupling between modules.
android.nonTransitiveRClass=true

# Use official Kotlin coding conventions.
kotlin.code.style=official
