# JUnit Platform configuration for Cucumber-JVM E2E tests.
# The CucumberE2ERunner class in runner/ is the primary entry point (see that file).
# These properties are read by the Cucumber JUnit Platform engine and supplement the
# @ConfigurationParameter annotations on the runner class.

# Cucumber plugins — pretty output to console + HTML report to build directory.
cucumber.plugin=pretty,html:build/reports/cucumber/f1-call-screening.html,json:build/reports/cucumber/f1-call-screening.json

# Glue packages — where Cucumber scans for @Given/@When/@Then step definitions and hooks.
cucumber.glue=steps,support

# Monochrome output — disable ANSI colours so CI log parsers don't see escape sequences.
cucumber.monochrome=false

# Publish — disabled; no remote reporting configured.
cucumber.publish.quiet=true
cucumber.publish.enabled=false
